name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: |
          uv venv --python 3.13
          # The tests run against the pyalso MAIN branch, not the tagged release the manifest
          # points at: the release tag is created after review, and pinning CI to a tag that does
          # not exist yet would turn the first run red. A test checks that the manifest tag matches
          # the pyalso version installed here, so a mismatch still shows up locally.
          uv pip install "pyalso[push]@https://github.com/frankrosano/pyalso/archive/refs/heads/main.zip"
          uv pip install "pytest-homeassistant-custom-component==0.13.316" "ruff==0.17.0"
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
