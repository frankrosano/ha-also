name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: |
          uv venv --python 3.13
          uv pip install "pyalso[push] @ https://github.com/frankrosano/pyalso/archive/refs/tags/v0.2.1.zip"
          uv pip install "pytest-homeassistant-custom-component==0.13.316" "ruff==0.17.0"
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
